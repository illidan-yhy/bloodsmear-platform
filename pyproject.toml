[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bloodsmear-mvp"
version = "0.1.0"
description = "Local blood-smear ONNX inference workflow MVP"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "pydantic-settings>=2.10,<3",
  "PyYAML>=6,<7",
  "numpy>=2,<3",
  "Pillow>=11,<13",
  "opencv-python-headless>=4.11,<6",
  "onnxruntime-gpu[cuda,cudnn]>=1.21,<1.31",
  "openpyxl>=3.1,<4",
  "reportlab>=5,<6",
  "tzdata>=2026.5",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=1,<2",
  "httpx2>=2.13,<3",
  "pypdf>=6,<7",
  "fonttools>=4.66,<5",
]

[project.scripts]
bloodsmear = "bloodsmear.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bloodsmear = ["templates/*.html", "static/*.css", "static/*.js", "assets/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --basetemp=.pytest-tmp"
